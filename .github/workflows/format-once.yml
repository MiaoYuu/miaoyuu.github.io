name: One-time Prettier cleanup

on:
  push:
    paths:
      - .github/workflows/format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned dependencies
        run: npm ci
      - name: Apply repository Prettier configuration
        run: npx prettier . --write
      - name: Commit formatting only when necessary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Formatting already clean."
          else
            git commit -m "Apply Prettier formatting to repository files"
            git push origin HEAD:master
          fi
